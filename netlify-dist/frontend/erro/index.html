<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acesso indisponível | OminiSaber</title>
    <link rel="stylesheet" href="../aluno/shared/responsive.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
        color: #172033;
        background: #f7f8fc;
        font-family: Inter, system-ui, sans-serif;
      }
      .error-card {
        width: min(100%, 32rem);
        padding: clamp(1.5rem, 5vw, 3rem);
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.1);
      }
      .error-icon {
        display: grid;
        place-items: center;
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        color: #fff;
        background: #dc2626;
        border-radius: 999px;
        font-size: 2rem;
        font-weight: 700;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }
      p {
        color: #64748b;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.1rem;
        color: #fff;
        background: #4f46e5;
        border-radius: 0.6rem;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        background: #4338ca;
      }
    </style>
    <!-- OminiSaber Parties: sistema visual compartilhado -->
    <link rel="stylesheet" href="../Parties/parties.css?v=20260924-5" />
    <script defer src="../Parties/parties.js?v=20260924-5"></script>
  </head>
  <body>
    <main class="error-card" role="alert">
      <div class="error-icon" aria-hidden="true">!</div>
      <h1>Não foi possível acessar esta página</h1>
      <p id="errorDescription">
        O endereço pode estar incorreto ou você não possui permissão para
        visualizar este conteúdo.
      </p>
      <a href="../login/index.html">Voltar para o login</a>
    </main>
    <script>
      const description = document.getElementById("errorDescription");
      if (
        new URLSearchParams(window.location.search).get("code") === "forbidden"
      ) {
        description.textContent =
          "Sua conta não possui o nível de permissão necessário para esta área.";
      }
    </script>
  </body>
</html>
