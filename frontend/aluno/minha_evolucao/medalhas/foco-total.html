    <script>/* Inlined by migrate-html.mjs before page styles: restore layout before paint. */
(() => {
  const root = document.documentElement;
  root.classList.add("os-student-shell", "os-shell-pending");
  let collapsed = false;
  try {
    collapsed = localStorage.getItem("ominisaber:student-sidebar-collapsed") === "true";
  } catch { /* Storage may be unavailable; the default layout still works. */ }
  root.classList.toggle("os-sidebar-collapsed", innerWidth > 900 && collapsed);
})();
</script>
    <style>/* First paint must never show the legacy navigation or animate restoration. */
html.os-student-shell body { box-sizing: border-box; }
html.os-student-shell :is(aside.sidebar, aside.app-sidebar, aside.study-sidebar, aside.library-sidebar, [data-shared-sidebar]):not(.os-party-student-sidebar):not(.correction-sidebar):not(.notes-drawer),
html.os-student-shell :is(.shared-sidebar-toggle, .sidebar-edge-reveal, .omni-sidebar-close, .omni-sidebar-edge, .omni-sidebar-mobile, .omni-sidebar-backdrop, .mobile-study-nav, .mobile-bar) {
  display: none !important;
}
html.os-shell-pending body,
html.os-shell-pending .os-party-student-sidebar,
html.os-shell-pending .os-student-sidebar-reopen {
  transition: none !important;
}
html.os-student-shell body > main,
html.os-student-shell :is(.main-content, .app-main, .study-main, .app-shell, .library-main) {
  margin-left: 0 !important;
  min-width: 0;
}
@media (min-width: 901px) {
  html.os-student-shell body { padding-left: 248px !important; }
  html.os-student-shell.os-sidebar-collapsed body { padding-left: 0 !important; }
}
@media (max-width: 900px) {
  html.os-student-shell body { padding-left: 0 !important; }
  html.os-student-shell .os-party-student-sidebar { transform: translateX(-105%); }
}
</style>
