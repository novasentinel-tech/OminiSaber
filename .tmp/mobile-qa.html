<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OminiSaber mobile QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: start center; background: #dfe5ed; }
      iframe { width: 390px; height: 844px; border: 0; border-radius: 22px; background: white; box-shadow: 0 24px 70px rgba(15, 23, 42, .24); }
    </style>
  </head>
  <body>
    <iframe title="Prévia mobile do OminiSaber" src="/frontend/aluno/mapa_dificuldades/index.html?materia=matematica"></iframe>
    <script>
      const target = new URLSearchParams(location.search).get("path");
      const params = new URLSearchParams(location.search);
      const viewportWidth = Math.max(320, Math.min(1920, Number(params.get("width")) || 390));
      document.querySelector("iframe").style.width = `${viewportWidth}px`;
      if (target && target.startsWith("/frontend/")) {
        document.querySelector("iframe").src = target;
      }
    </script>
  </body>
</html>
