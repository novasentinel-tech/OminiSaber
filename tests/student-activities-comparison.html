<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Comparação visual · Atividades</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #e9edf5; color: #13213a; font: 700 13px system-ui, sans-serif; }
      header { display: flex; justify-content: space-between; margin-bottom: 12px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      section { overflow: hidden; border: 1px solid #ccd5e5; border-radius: 14px; background: #fff; }
      h2 { margin: 0; padding: 10px 14px; border-bottom: 1px solid #dce2ec; font-size: 13px; }
      img { display: block; width: 100%; height: 760px; border: 0; object-fit: contain; object-position: top; background: #f5f7fb; }
      iframe { display: block; width: 1440px; height: 1024px; border: 0; background: #f5f7fb; transform: scale(.46); transform-origin: top left; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header><span>Design QA · Central de atividades</span><span data-state></span></header>
    <main>
      <section><h2>Referência selecionada</h2><img data-reference alt="Referência visual selecionada" /></section>
      <section><h2>Implementação renderizada</h2><iframe data-implementation title="Implementação renderizada"></iframe></section>
    </main>
    <script>
      const state = new URLSearchParams(location.search).get("state") || "pending";
      const config = {
        pending: ["Para fazer", "../docs/design/evidence/activities-pending-reference.png", ""],
        done: ["Entregues", "../docs/design/evidence/activities-delivered-reference.png", "#done"],
        all: ["Todas", "../docs/design/evidence/activities-all-reference.png", "#all"],
      }[state];
      document.querySelector("[data-state]").textContent = config[0];
      document.querySelector("[data-reference]").src = config[1];
      document.querySelector("[data-implementation]").src = `student-activities-responsive.html${config[2]}`;
    </script>
  </body>
</html>
